[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vibescope"
version = "0.1.0"
description = "Local video vibration measurement and frequency-selective motion visualization"
readme = "README.md"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Image Processing", "Topic :: Scientific/Engineering :: Physics"]
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "opencv-python-headless>=4.10,<6", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "matplotlib>=3.11,<4", "imageio-ffmpeg>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
accelerated = ["torch>=2.5", "einops>=0.8"]

[project.scripts]
vibescope = "vibescope.cli:main"

[tool.setuptools.package-data]
vibescope = ["static/*", "models/*.npz", "models/*.json", "data/*.mp4", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/nazeeh111/VibeScope"
Documentation = "https://github.com/nazeeh111/VibeScope#readme"
Issues = "https://github.com/nazeeh111/VibeScope/issues"

[tool.setuptools.packages.find]
include = ["vibescope*"]

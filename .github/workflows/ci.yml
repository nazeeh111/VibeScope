name: measurement checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPL_IGNORE_SYSTEM_FONTS: '1'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/benchmark.py --quick --output /tmp/vibescope-benchmark
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-${{ matrix.python-version }}
          path: /tmp/vibescope-benchmark
  browser:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPL_IGNORE_SYSTEM_FONTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm ci
        working-directory: tests/ui
      - name: Select a browser with H264 playback
        working-directory: tests/ui
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chrome
          fi
          echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Start local instrument
        run: |
          python -m vibescope.cli serve > /tmp/vibescope.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/vibescope.log
          exit 1
      - run: npm test
        working-directory: tests/ui
      - name: Server diagnostics on failure
        if: failure()
        run: cat /tmp/vibescope.log || true

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2040" viewBox="0 0 600 2040" role="img" aria-labelledby="title desc"><title id="title">VibeScope: measurement from original frames</title><desc id="desc">Original video is decoded and tracked. An optional stationary reference removes translation. Any poor tracking frame stops the run. Original-frame displacement supplies the spectrum and sine fit. Visuals use originals and measured motion; display gain never feeds back into measurement. Completed files are published together after rendering and reporting succeed.</desc><defs><marker id="cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#73deee" stroke-width="1.5"/></marker><marker id="line" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#354653" stroke-width="1.5"/></marker></defs><rect width="600" height="2040" fill="#080d12"/><text x="32" y="43" fill="#73deee" font-family="monospace" font-size="19" font-weight="400">VIBESCOPE / DATA PATH</text><text x="32" y="103" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700">Measure from</text><text x="32" y="157" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700">originals.</text><text x="32" y="201" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Gain never feeds the measurement.</text><rect x="32" y="248" width="536" height="210" rx="12" fill="#111a22" stroke="#354653"/><text x="54" y="282" fill="#73deee" font-family="monospace" font-size="19" font-weight="400">01 / ORIGINAL INPUT</text><text x="54" y="323" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Decode the clip</text><text x="54" y="361" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Original RGB frames</text><text x="54" y="395" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Capture fps + timing</text><text x="54" y="429" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Source hash retained</text><path d="M300 462V482" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="32" y="490" width="536" height="210" rx="12" fill="#111a22" stroke="#354653"/><text x="54" y="524" fill="#73deee" font-family="monospace" font-size="19" font-weight="400">02 / REGION TRACKING</text><text x="54" y="565" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Measure the motion</text><text x="54" y="603" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Selected tracker → target</text><text x="54" y="637" fill="#f1c580" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Optional reference:</text><text x="54" y="671" fill="#f1c580" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">classical x/y → subtract</text><path d="M300 704V724" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="32" y="732" width="536" height="210" rx="12" fill="#111a22" stroke="#354653"/><text x="54" y="766" fill="#73deee" font-family="monospace" font-size="19" font-weight="400">03 / TRACKING GATE</text><text x="54" y="807" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Check every frame</text><text x="54" y="845" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">All tracking quality ≥ 0.25</text><text x="54" y="879" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Target and reference</text><text x="54" y="913" fill="#ffb3ad" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Any failure → stop</text><path d="M300 946V966" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="32" y="974" width="536" height="210" rx="12" fill="#111a22" stroke="#354653"/><text x="54" y="1008" fill="#73deee" font-family="monospace" font-size="19" font-weight="400">04 / SIGNAL ANALYSIS</text><text x="54" y="1049" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Analyze displacement</text><text x="54" y="1087" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">PSD + sine fit on raw</text><text x="54" y="1121" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">A tone can stay unresolved</text><text x="54" y="1155" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Bandpass uses the full clip</text><text x="32" y="1226" fill="#f1c580" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Without a reference: camera motion remains.</text><text x="32" y="1262" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Quality is a fit index, not confidence.</text><path d="M300 1184V1198H586V1284H300V1302" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="32" y="1310" width="536" height="218" rx="12" fill="#111a22" stroke="#73deee"/><text x="54" y="1346" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">MEASURED RESULTS</text><text x="54" y="1389" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Frequency + sine-fit amplitude on raw</text><text x="54" y="1422" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Resolution, parameters and warnings</text><text x="54" y="1455" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">A tone may stay unresolved.</text><text x="54" y="1488" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">A response peak is not resonance.</text><path d="M586 1284V1550H576" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="32" y="1550" width="536" height="232" rx="12" fill="#111a22" stroke="#354653"/><text x="54" y="1586" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">DISPLAY PRODUCTS</text><text x="54" y="1629" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Original frames + camera estimates</text><text x="54" y="1662" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Band / phase, gain and soft blending</text><text x="54" y="1695" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Encoding + intensity activity map</text><text x="54" y="1742" fill="#73deee" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">No enhanced-pixel feedback.</text><path d="M32 1484H14V1800H300V1782" fill="none" stroke="#73deee" stroke-width="2"/><path d="M300 1800V1810" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="32" y="1818" width="536" height="154" rx="12" fill="#111a22" stroke="#354653"/><text x="54" y="1854" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">ONE COMPLETED BUNDLE</text><text x="54" y="1895" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Fresh folder published after visuals,</text><text x="54" y="1931" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">CSV, plot and report succeed.</text><text x="32" y="2014" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Implementation map · no new physical validation</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1190" viewBox="0 0 1440 1190" role="img" aria-labelledby="title desc"><title id="title">VibeScope: measurement from original frames</title><desc id="desc">Original video is decoded and tracked. An optional stationary reference removes translation. Any poor tracking frame stops the run. Original-frame displacement supplies the spectrum and sine fit. Visuals use originals and measured motion; display gain never feeds back into measurement. Completed files are published together after rendering and reporting succeed.</desc><defs><marker id="cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#73deee" stroke-width="1.5"/></marker><marker id="line" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#354653" stroke-width="1.5"/></marker></defs><rect width="1440" height="1190" fill="#080d12"/><text x="48" y="52" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">VIBESCOPE / MEASUREMENT PATH</text><text x="48" y="120" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Measure from originals.</text><text x="48" y="166" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">Display gain never feeds the measurement.</text><rect x="48" y="232" width="300" height="288" rx="12" fill="#111a22" stroke="#354653"/><text x="68" y="268" fill="#73deee" font-family="monospace" font-size="18" font-weight="400">01 / ORIGINAL INPUT</text><text x="68" y="312" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Decode the clip</text><text x="68" y="362" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Original RGB frames</text><text x="68" y="399" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Capture fps + timing</text><text x="68" y="436" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Source hash retained</text><path d="M356 380H384" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="396" y="232" width="300" height="288" rx="12" fill="#111a22" stroke="#354653"/><text x="416" y="268" fill="#73deee" font-family="monospace" font-size="18" font-weight="400">02 / REGION TRACKING</text><text x="416" y="312" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Measure the motion</text><text x="416" y="362" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Selected tracker → target</text><text x="416" y="399" fill="#f1c580" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Optional reference:</text><text x="416" y="436" fill="#f1c580" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">classical x/y → subtract</text><path d="M704 380H732" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="744" y="232" width="300" height="288" rx="12" fill="#111a22" stroke="#354653"/><text x="764" y="268" fill="#73deee" font-family="monospace" font-size="18" font-weight="400">03 / TRACKING GATE</text><text x="764" y="312" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Check every frame</text><text x="764" y="362" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">All tracking quality ≥ 0.25</text><text x="764" y="399" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Target and reference</text><text x="764" y="436" fill="#ffb3ad" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Any failure → stop</text><path d="M1052 380H1080" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="1092" y="232" width="300" height="288" rx="12" fill="#111a22" stroke="#354653"/><text x="1112" y="268" fill="#73deee" font-family="monospace" font-size="18" font-weight="400">04 / SIGNAL ANALYSIS</text><text x="1112" y="312" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Analyze displacement</text><text x="1112" y="362" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">PSD + sine fit on raw</text><text x="1112" y="399" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">A tone can stay unresolved</text><text x="1112" y="436" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Bandpass uses the full clip</text><text x="48" y="562" fill="#f1c580" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">No reference: camera translation remains.</text><text x="48" y="598" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Quality is a fit index, not confidence.</text><path d="M894 520V548" stroke="#ffb3ad" stroke-width="2"/><rect x="744" y="550" width="300" height="72" rx="12" fill="#111a22" stroke="#354653"/><text x="764" y="593" fill="#ffb3ad" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">FAIL → no completed result</text><path d="M1242 520V644H372V684" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><path d="M1242 644V684" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="48" y="684" width="648" height="252" rx="12" fill="#111a22" stroke="#73deee"/><text x="72" y="724" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">MEASURED RESULTS</text><text x="72" y="769" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Keep the evidence with the values.</text><text x="72" y="813" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Frequency + sine-fit amplitude from raw displacement</text><text x="72" y="851" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Resolution, quality, parameters and warnings retained</text><text x="72" y="889" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Unresolved is a result; a response peak is not resonance.</text><rect x="744" y="684" width="648" height="252" rx="12" fill="#111a22" stroke="#354653"/><text x="768" y="724" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">DISPLAY PRODUCTS</text><text x="768" y="769" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Magnify what the camera recorded.</text><text x="768" y="813" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Original frames + camera estimates + band / phase</text><text x="768" y="851" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Gain, soft-edge blending, encoding and intensity map</text><text x="768" y="889" fill="#73deee" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Enhanced pixels never re-enter tracking.</text><path d="M372 936V974H1068V936" fill="none" stroke="#73deee" stroke-width="2"/><path d="M720 974V1000" fill="none" stroke="#73deee" stroke-width="2" marker-end="url(#cyan)"/><rect x="48" y="1010" width="1344" height="126" rx="12" fill="#111a22" stroke="#354653"/><text x="72" y="1053" fill="#73deee" font-family="monospace" font-size="20" font-weight="400">ONE COMPLETED BUNDLE</text><text x="72" y="1097" fill="#edf4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Publish the fresh result folder after visuals, CSV, plot and report succeed.</text><text x="48" y="1170" fill="#b4c3cd" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Data path of the shipped implementation · No new run or physical validation is shown.</text></svg>
